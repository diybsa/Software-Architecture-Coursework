<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Price Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d12;
      --surface: #111620;
      --surface2: #1a2030;
      --border: #1e2a3a;
      --accent1: #00e5ff;
      --accent2: #ff4d6d;
      --accent1-dim: rgba(0, 229, 255, 0.12);
      --accent2-dim: rgba(255, 77, 109, 0.12);
      --text: #e8edf5;
      --muted: #4a5568;
      --grid: rgba(255,255,255,0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
    }

    .header {
      margin-bottom: 32px;
      animation: fadeDown 0.6s ease both;
    }

    .header-tag {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--accent1);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.8;
    }

    .header h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .header h1 span {
      color: var(--accent1);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .input-group {
      flex: 1;
      min-width: 140px;
      position: relative;
    }

    .input-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input-group.share1 .input-label { color: var(--accent1); opacity: 0.7; }
    .input-group.share2 .input-label { color: var(--accent2); opacity: 0.7; }

    input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group.share1 input:focus {
      border-color: var(--accent1);
      box-shadow: 0 0 0 3px var(--accent1-dim);
    }

    .input-group.share2 input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px var(--accent2-dim);
    }

    input::placeholder { color: var(--muted); letter-spacing: 1px; }

    button {
      padding: 12px 28px;
      background: var(--accent1);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #33eaff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    }

    button:active { transform: scale(0.97); }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      min-height: 28px;
    }

    .status-pill {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      display: none;
    }

    .status-pill.s1 {
      background: var(--accent1-dim);
      color: var(--accent1);
      border: 1px solid rgba(0,229,255,0.2);
    }

    .status-pill.s2 {
      background: var(--accent2-dim);
      color: var(--accent2);
      border: 1px solid rgba(255,77,109,0.2);
    }

    .status-pill.visible { display: inline-block; }

    .chart-wrap {
      position: relative;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      overflow: hidden;
    }

    .chart-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .legend {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-dot.s1 { background: var(--accent1); box-shadow: 0 0 6px var(--accent1); }
    .legend-dot.s2 { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    .legend-label { color: var(--muted); }
    .legend-symbol { color: var(--text); font-weight: 700; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-tag">// Market Analysis Tool</div>
      <h1>Share Price <span>Comparison</span></h1>
    </div>

    <div class="card">
      <div class="controls">
        <div class="input-group share1">
          <div class="input-label">Share 01</div>
          <input id="symbol1" placeholder="AAPL" maxlength="6">
        </div>
        <div class="input-group share2">
          <div class="input-label">Share 02</div>
          <input id="symbol2" placeholder="MSFT" maxlength="6">
        </div>
        <button onclick="loadChart()">Compare →</button>
      </div>

      <div class="status-bar">
        <span class="status-pill s1" id="pill1"></span>
        <span class="status-pill s2" id="pill2"></span>
      </div>

      <div class="chart-wrap">
        <canvas id="chart" width="780" height="340"></canvas>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot s1"></div>
          <span class="legend-label">Share 01 —</span>
          <span class="legend-symbol" id="legend1">—</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot s2"></div>
          <span class="legend-label">Share 02 —</span>
          <span class="legend-symbol" id="legend2">—</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function makeData(symbol) {
      let base = 20;
      for (let i = 0; i < symbol.length; i++) base += symbol.charCodeAt(i);
      let data = [];
      for (let i = 0; i < 6; i++) {
        data.push((base % 40) + 20 + (i * 2) - (i % 2 ? 5 : 0));
        base = Math.floor(base / 2) + 11;
      }
      return data;
    }

    function drawAxes(ctx, W, H, pad) {
      const gridColor = 'rgba(255,255,255,0.04)';
      const labelColor = '#4a5568';

      ctx.font = '11px Space Mono, monospace';
      ctx.fillStyle = labelColor;

      const labels = ['Day 1','Day 2','Day 3','Day 4','Day 5','Day 6'];
      const step = (W - pad.left - pad.right) / (labels.length - 1);

      for (let i = 0; i < labels.length; i++) {
        const x = pad.left + i * step;
        ctx.fillStyle = labelColor;
        ctx.textAlign = 'center';
        ctx.fillText(labels[i], x, H - 8);

        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, H - pad.bottom);
        ctx.stroke();
      }

      for (let y = 0; y <= 5; y++) {
        const value = 20 + y * 10;
        const yPos = H - pad.bottom - y * ((H - pad.top - pad.bottom) / 5);
        ctx.fillStyle = labelColor;
        ctx.textAlign = 'right';
        ctx.fillText(value, pad.left - 8, yPos + 4);

        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad.left, yPos);
        ctx.lineTo(W - pad.right, yPos);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.left, pad.top);
      ctx.lineTo(pad.left, H - pad.bottom);
      ctx.lineTo(W - pad.right, H - pad.bottom);
      ctx.stroke();
    }

    function drawLine(ctx, data, color, glowColor, W, H, pad) {
      const step = (W - pad.left - pad.right) / (data.length - 1);
      const scaleY = (H - pad.top - pad.bottom) / 50;

      const points = data.map((v, i) => ({
        x: pad.left + i * step,
        y: H - pad.bottom - (v - 20) * scaleY
      }));

      const grad = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
      grad.addColorStop(0, glowColor.replace(')', ', 0.18)').replace('rgb', 'rgba'));
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.beginPath();
      ctx.moveTo(points[0].x, H - pad.bottom);
      points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(points[points.length - 1].x, H - pad.bottom);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.shadowBlur = 0;

      points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#0a0d12';
        ctx.fill();
      });
    }

    function loadChart() {
      const s1 = document.getElementById('symbol1').value.trim().toUpperCase();
      const s2 = document.getElementById('symbol2').value.trim().toUpperCase();

      if (!s1 || !s2) {
        alert('Please enter both share symbols');
        return;
      }

      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const pad = { top: 20, bottom: 40, left: 50, right: 20 };

      ctx.clearRect(0, 0, W, H);
      drawAxes(ctx, W, H, pad);
      drawLine(ctx, makeData(s1), '#00e5ff', 'rgb(0,229,255)', W, H, pad);
      drawLine(ctx, makeData(s2), '#ff4d6d', 'rgb(255,77,109)', W, H, pad);

      document.getElementById('pill1').textContent = s1;
      document.getElementById('pill1').classList.add('visible');
      document.getElementById('pill2').textContent = s2;
      document.getElementById('pill2').classList.add('visible');
      document.getElementById('legend1').textContent = s1;
      document.getElementById('legend2').textContent = s2;
    }
  </script>
</body>
</html>
